services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: authorityguard
      POSTGRES_PASSWORD: authorityguard   # local demo only
      POSTGRES_DB: authorityguard
    ports:
      - "127.0.0.1:5432:5432"             # bound to localhost, never public
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authorityguard"]
      interval: 5s
      retries: 10

  api:
    build: .
    environment:
      AG_ENV: demo
      AG_DATABASE_URL: postgresql+psycopg://authorityguard:authorityguard@db:5432/authorityguard
      AG_ADMIN_API_KEY: ${AG_ADMIN_API_KEY:-change-me-local-only}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
